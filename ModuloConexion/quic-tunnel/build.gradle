allprojects {
    group = 'com.quictunnel'
    version = '1.0.0'
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile) {
        options.release = 17
    }

    repositories {
        mavenCentral()
    }
}